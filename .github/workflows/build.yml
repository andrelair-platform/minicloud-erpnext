name: build

# ghcr-only (Harbor decommissioned 2026-11-16). Build+push the custom erpnext image to ghcr + cosign/SBOM,
# then bump the deployed tag in gitops. Login via GITOPS_TOKEN (write:packages) — the package is linked to
# minicloud-gitops from the decommission crane-copy, so the repo-scoped GITHUB_TOKEN can't write it.
on:
  push:
    branches: [main, dev]
    paths-ignore: ['docs/**', 'bmad/**', 'scripts/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'bmad/**', 'scripts/**', '**/*.md']

env:
  GHCR_IMAGE: ghcr.io/andrelair-platform/erpnext-ktayl
  GITOPS_REPO: andrelair-platform/minicloud-gitops
  ERPNEXT_VERSION: v16.28.0

jobs:
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest: ${{ steps.build.outputs.digest }}
      branch: ${{ steps.meta.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME//\//-}
          if [ "$BRANCH" = "main" ]; then
            TAG="${{ env.ERPNEXT_VERSION }}-facturx-${SHA}"
          else
            TAG="${BRANCH}-${SHA}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: AndreLiar
          password: ${{ secrets.GITOPS_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push to ghcr
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.image_tag }}
          build-args: |
            CA_CERT=${{ secrets.MINICLOUD_CA_CERT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          scanners: 'vuln'
          timeout: 20m
      - name: Install Cosign
        if: github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        if: github.ref_name == 'main'
        uses: anchore/sbom-action/download-syft@v0
      - name: Sign image + attach SBOM
        if: github.ref_name != 'dev'
        run: |
          cosign sign --yes "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            syft "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}" -o cyclonedx-json=sbom.json
            cosign attach sbom --sbom sbom.json --type cyclonedx "${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}"
          fi

  bump-gitops:
    needs: build-and-push
    if: needs.build-and-push.outputs.branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minicloud-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Bump tag in erpnext-values.yaml (ghcr)
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          F=helm-values/minicloud-1/erpnext-values.yaml
          sed -i "s|^  repository: .*|  repository: ghcr.io/andrelair-platform/erpnext-ktayl|" "$F"
          sed -i "s|^  tag: .*facturx.*|  tag: \"${NEW_TAG}\"|" "$F"
          git add "$F"
          if git diff --cached --quiet; then echo "No change — already at ${NEW_TAG}"; exit 0; fi
          BRANCH="ci/erpnext-bump-${NEW_TAG}"
          git checkout -b "${BRANCH}"
          git commit -S -m "ci(erpnext): bump image to ${NEW_TAG}"
          git push origin "${BRANCH}"
          gh pr create --repo "${{ env.GITOPS_REPO }}" --title "ci(erpnext): bump image to ${NEW_TAG}" \
            --body "Automated image bump (ghcr)." --head "${BRANCH}" --base main
          gh pr merge --repo "${{ env.GITOPS_REPO }}" --admin --squash --delete-branch "${BRANCH}"
